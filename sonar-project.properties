# Identitas Project SonarQube
sonar.projectKey=map-lite-test
sonar.projectName=map-lite-test
sonar.projectVersion=1.0.0

# Lokasi source code dan unit test
sonar.sources=src
sonar.tests=src

# Encoding source code
sonar.sourceEncoding=UTF-8

# File unit test yang diikutsertakan sebagai test
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/__tests__/**

# File dan folder yang dikecualikan dari analisis source code
sonar.exclusions=**/node_modules/**,**/ios/**,**/android/**,**/.expo/**,**/dist/**,**/web-build/**,**/coverage/**,**/scripts/**,**/plugins/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/assets/**

# Konfigurasi TypeScript
sonar.typescript.tsconfigPaths=tsconfig.json

# Laporan test coverage (Jest LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

